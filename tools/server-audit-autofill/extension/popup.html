<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bob_Portal Audit Autofill</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 420px;
        margin: 0;
        padding: 12px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #16212e;
        background: #fff;
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      p.sub { margin: 0 0 10px; color: #5b6876; font-size: 12px; }
      textarea {
        width: 100%;
        height: 150px;
        box-sizing: border-box;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 7px;
        border: 1px solid #c3ccd6;
        border-radius: 5px;
        resize: vertical;
      }
      .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      button {
        font: 500 12px/1.3 system-ui, sans-serif;
        padding: 7px 10px;
        border-radius: 5px;
        border: 1px solid #c3ccd6;
        background: #f3f5f8;
        color: #16212e;
        cursor: pointer;
      }
      button.primary { background: #1b5fa8; border-color: #1b5fa8; color: #fff; }
      button:disabled { opacity: .55; cursor: default; }
      #msg {
        margin-top: 10px;
        padding: 8px 9px;
        border-radius: 5px;
        font-size: 12px;
        display: none;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 190px;
        overflow-y: auto;
      }
      #msg.ok { display: block; background: #e6f4ea; border: 1px solid #a8d5b7; }
      #msg.warn { display: block; background: #fdf2dc; border: 1px solid #e5c583; }
      #msg.err { display: block; background: #fdeaea; border: 1px solid #e8aaaa; }
      .hint { margin-top: 9px; font-size: 11px; color: #5b6876; }
      label.mode { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    </style>
  </head>
  <body>
    <h1>Bob_Portal Audit Autofill</h1>
    <p class="sub">
      Paste the <code>cpanel-audit.sh</code> report (or an AUDIT_DATA JSON array).
      The extension fills each modal; you review and submit every item.
    </p>

    <textarea
      id="input"
      spellcheck="false"
      placeholder="Paste report-detailed.log here, e.g.&#10;&#10;=== 1. Threat Protection ===&#10;System Firewall        : Good - Active: iptables nftables&#10;Web App Firewall       : Warning - Rules Engine is unknown&#10;&#10;...or a JSON array produced by parse-audit-report.js"
    ></textarea>

    <div class="row">
      <button id="preview">Preview</button>
      <button id="start" class="primary">Save &amp; start from item 1</button>
      <button id="copy">Copy JSON</button>
    </div>
    <div class="row">
      <label class="mode">
        <input type="checkbox" id="immediate" />
        Advance without waiting for the save confirmation
      </label>
    </div>
    <div class="row">
      <button id="status">Show progress</button>
      <button id="reset">Reset progress</button>
      <button id="clear">Clear data</button>
    </div>

    <div id="msg"></div>

    <p class="hint">
      Nothing here ever clicks Submit. Items the report gives no clear verdict
      for are listed and left blank rather than guessed.
    </p>

    <script src="lib/rules.js"></script>
    <script src="lib/parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
