<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>View Server Audit (mock)</title>
    <!--
      Stand-in for the "View Server Audit" page, screenshotted by test/e2e.test.js to make a reference image.
      ?states=GGGGG,GGGGGGG,...  one letter per row: G ✓ green, R ✗ red, N grey NA dot, Y not done.
    -->
    <style>
      body { font: 13px system-ui, sans-serif; margin: 0; background: #fff; color: #525f7f; }
      .banner { height: 70px; background: #1e3a8a; }
      .sidenav { position: fixed; left: 0; top: 0; bottom: 0; width: 180px; background: #fff; border-right: 1px solid #eee; padding: 20px; }
      .main { margin-left: 200px; padding: 20px; }
      table.info { margin: 0 auto 20px; border-collapse: collapse; }
      table.info th { background: #0c71c3; color: #fff; padding: 12px 24px; font-size: 11px; }
      table.info td { padding: 12px 24px; text-align: center; }
      .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
      .col { flex: 0 0 33.333%; max-width: 33.333%; padding: 0 10px; box-sizing: border-box; }
      .card { margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
      .card-header { background: #0c71c3; color: #fff; padding: 13px 15px; font-weight: 600; }
      .item { display: flex; align-items: center; padding: 12px 15px; border-top: 1px solid #e9ecef; }
      .item span { flex: 1; }
      svg { display: block; }
      .st { margin-right: 12px; }
    </style>
  </head>
  <body>
    <div class="sidenav">List Customers<br /><br />List Servers</div>
    <div class="banner"></div>
    <div class="main">
      <table class="info">
        <tr><th>SERVER NAME</th><th>CONTROL PANEL</th><th>OS DISTRIBUTION</th><th>MONTH</th></tr>
        <tr><td>server-01.example.com</td><td>cPanel/WHM</td><td>CloudLinux 7.9</td><td>September 2026</td></tr>
      </table>
      <div class="row" id="grid"></div>
    </div>
    <script>
      const SECTIONS = [
        ['Threat Protection', ['System Firewall', 'Malware Scanner', 'Failed Login Detection', 'Web App Firewall', 'Rootkit Scanner']],
        ['Software Updates', ['Control Panel', 'Operating System', 'PHP', 'CMS', 'Web Server', 'Database Server', 'Other Softwares']],
        ['Server Health', ['Server Uptime', 'HTTP Uptime', 'CPU Usage', 'RAM Usage', 'Disc Space Usage', 'Email Queue', 'IP Reputation']],
        ['Backup', ['Local Backup', 'Remote Backup', 'Daily Backup', 'Weekly Backup', 'Monthly Backup', 'Recent Last Backup', 'Size Of Last Backup']],
        ['Software Life Time', ['Control Panel', 'Operating System', 'CMS', 'Software Stack']],
        ['Proactive Defence', ['/tmp Security', 'Reboot Procedure', 'IP RDNS', 'Malware Scan', 'Rootkit Check', 'SSH Root Access Security', 'PHP Functions Security', 'Root password health']],
      ];
      const states = (new URLSearchParams(location.search).get('states') || 'GGGGG,GGGGGGG,GGGGGGG,GGGNGGG,GRRR,GGGRGRGR').split(',');
      const ICON = {
        G: '<svg class="st" width="14" height="12" viewBox="0 0 14 12"><path d="M1.5 6.5l4 4 7-9" fill="none" stroke="#2f5e3a" stroke-width="2.4"/></svg>',
        R: '<svg class="st" width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#b83c44" stroke-width="2.4"/></svg>',
        N: '<svg class="st" width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2.5" fill="#88949f"/></svg>',
        Y: '<svg class="st" width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="#f5c518"/></svg>',
      };
      const EYE =
        '<svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 0C4 0 1 3 0 5.5 1 8 4 11 8 11s7-3 8-5.5C15 3 12 0 8 0z" fill="#1e70ad"/><circle cx="8" cy="5.5" r="2.6" fill="#fff"/><circle cx="8" cy="5.5" r="1.3" fill="#1e70ad"/></svg>';
      document.getElementById('grid').innerHTML = SECTIONS.map(
        ([name, items], s) => `<div class="col"><div class="card"><div class="card-header">${name}</div>
          ${items.map((label, i) => `<div class="item"><span>${label}</span>${ICON[states[s][i]]}${EYE}</div>`).join('')}
        </div></div>`
      ).join('');
    </script>
  </body>
</html>
