<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiz Autopilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Quiz Autopilot</h1>
      <span id="state" class="badge">Idle</span>
    </header>

    <label for="key" class="label">Answer key <span class="hint">(question | answer, one per line — a pasted markdown table works)</span></label>
    <textarea id="key" spellcheck="false" placeholder="| 1 | Which plan provides assistance with AnyDesk? | Dedicated Engineer Session or PLSM |
Select correct statements about MySQL recovery | All of the above
Q: What to do when you get server add tickets?
A: All of the above"></textarea>

    <div class="row">
      <button id="save">Save key</button>
      <span id="parsed" class="muted"></span>
    </div>
    <details id="previewBox">
      <summary>Show parsed questions</summary>
      <ol id="preview"></ol>
    </details>

    <div class="row">
      <label for="delay">Wait before clicking Next</label>
      <input id="delay" type="number" min="300" max="10000" step="100" /> <span class="muted">ms</span>
    </div>

    <div class="row buttons">
      <button id="start" class="primary">Start autopilot</button>
      <button id="stop" class="danger" hidden>Stop</button>
      <button id="once">Answer this page only</button>
    </div>
    <p id="msg" class="msg" role="status"></p>
    <p class="muted small">
      Open the quiz question page first. The autopilot ticks the matching answer and presses <b>Next question</b>. It pauses on
      questions it isn't sure about, and it always asks you before pressing <b>End test</b>.
    </p>

    <script src="../matcher.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
